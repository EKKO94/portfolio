<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Open Graph image source</title>
<style>
  @font-face { font-family: "IBM Plex Serif"; src: url("../assets/fonts/ibm-plex-serif-500-normal.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "IBM Plex Mono"; src: url("../assets/fonts/ibm-plex-mono-500.woff2") format("woff2"); font-weight: 500; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #f4f5f6; position: relative; overflow: hidden; color: #040403; }
  .name { position: absolute; left: 72px; top: 58px; font: 500 34px "IBM Plex Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; }
  h1 { position: absolute; left: 72px; top: 160px; font: 500 112px/1.02 "IBM Plex Serif", Georgia, serif; letter-spacing: -0.03em; }
  h1 em { font-style: normal; color: #c23a1c; }
  .tag { position: absolute; left: 72px; bottom: 56px; font: 500 34px "IBM Plex Mono", monospace; letter-spacing: 0.05em; text-transform: uppercase; color: #c23a1c; }
  .bar { position: absolute; left: 0; top: 0; width: 100%; height: 10px; background: #c23a1c; }
  img { position: absolute; right: -10px; bottom: -4px; height: 590px; width: auto; }
</style>
</head>
<body>
  <div class="bar"></div>
  <p class="name">Adrian Carballo</p>
  <h1><em>AI</em> Product<br>Designer</h1>
  <p class="tag">Complex B2B platforms</p>
  <img src="../assets/img/hero-portrait.webp" alt="">
</body>
</html>
